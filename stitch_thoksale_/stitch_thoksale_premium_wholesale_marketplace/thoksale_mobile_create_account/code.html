<body class="bg-background text-on-surface min-h-screen flex flex-col items-center">
<!-- Container for mobile view, max-width on desktop to simulate mobile app -->
<main class="w-full max-w-md mx-auto min-h-screen flex flex-col bg-background relative shadow-sm">
<!-- Header -->
<header class="flex items-center justify-between px-margin-mobile w-full h-16 bg-surface z-10 sticky top-0">
<button aria-label="Go back" class="p-2 -ml-2 text-primary hover:opacity-80 transition-opacity duration-200">
<span aria-hidden="true" class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<div class="h-8 flex-1 flex justify-center">
<img alt="THOKSALE Logo" class="h-full object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB7ft8hYePn-78MrqvWQSgKp1RW1f_XC7-R7XykHAt2rJzqIUttFxihlPDiv__sfXyjGcKBZUmFF7rou6FjWk4jffY_APWFerxliHaXlzxwXAqC6yYFfsBQc5g5zsbnIccm6Mo9GjWnYggQynunaQzX35Clu2NGxolITJviMelJ-t21wU4z0S7GqLeJTTbr3TJdGDN7Nqt8wYetrUMgetd3GeDUilT3U1vcK0TDswJYG9wSJLiEN8XPNkam8A71cegTulU"/>
</div>
<div class="w-10"></div> <!-- Spacer for balance -->
</header>
<!-- Main Content -->
<div class="flex-1 flex flex-col px-margin-mobile py-lg">
<!-- Heading -->
<div class="mb-lg">
<h1 class="font-headline-md text-headline-md text-primary mb-2">Create your account</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Join THOKSALE to buy or sell wholesale.</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-md flex-1" id="registrationForm">
<!-- Full Name Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="fullName">Full Name</label>
<div class="bg-surface-container-lowest border input-border rounded-DEFAULT input-focus transition-all duration-200 flex items-center px-sm h-12 shadow-sm">
<input class="w-full bg-transparent border-none p-0 focus:ring-0 font-body-md text-body-md text-on-surface placeholder:text-outline-variant" id="fullName" name="fullName" placeholder="Enter your full name" required="" type="text"/>
</div>
</div>
<!-- Mobile Number Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="mobileNumber">Mobile Number</label>
<div class="bg-surface-container-lowest border input-border rounded-DEFAULT input-focus transition-all duration-200 flex items-center h-12 shadow-sm overflow-hidden">
<div class="px-sm border-r input-border h-full flex items-center bg-surface-container-low font-data-mono text-data-mono text-on-surface-variant">
                            +91
                        </div>
<input class="w-full bg-transparent border-none px-sm focus:ring-0 font-body-md text-body-md text-on-surface placeholder:text-outline-variant" id="mobileNumber" name="mobileNumber" pattern="[0-9]{10}" placeholder="98765 43210" required="" type="tel"/>
</div>
</div>
<!-- Email Field -->
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-end">
<label class="font-label-md text-label-md text-on-surface" for="email">Email Address</label>
<span class="font-label-md text-label-md text-on-surface-variant font-normal">(Optional)</span>
</div>
<div class="bg-surface-container-lowest border input-border rounded-DEFAULT input-focus transition-all duration-200 flex items-center px-sm h-12 shadow-sm">
<input class="w-full bg-transparent border-none p-0 focus:ring-0 font-body-md text-body-md text-on-surface placeholder:text-outline-variant" id="email" name="email" placeholder="you@example.com" type="email"/>
</div>
</div>
<div class="mt-auto pt-lg pb-md flex flex-col gap-md">
<!-- Primary Action -->
<button class="w-full h-12 rounded-DEFAULT bg-secondary text-on-secondary font-label-md text-label-md flex items-center justify-center transition-all duration-300 opacity-50 cursor-not-allowed" disabled="" id="submitBtn" type="submit">
                        Continue
                    </button>
<!-- Secondary Action -->
<a class="w-full text-center font-label-md text-label-md text-primary hover:text-secondary transition-colors duration-200" href="/login">
                        Already have an account? Log in
                    </a>
</div>
</form>
</div>
<!-- Footer -->
<footer class="w-full px-margin-mobile py-md flex flex-col items-center gap-xs mt-auto">
<p class="font-label-md text-label-md text-on-surface-variant text-center leading-relaxed">
                By continuing, you agree to THOKSALE's <br/>
<a class="text-secondary font-bold hover:opacity-80 underline decoration-1 underline-offset-2" href="#">Terms of Use</a> and 
                <a class="text-secondary font-bold hover:opacity-80 underline decoration-1 underline-offset-2" href="#">Privacy Policy</a>.
            </p>
</footer>
</main>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('registrationForm');
            const fullName = document.getElementById('fullName');
            const mobileNumber = document.getElementById('mobileNumber');
            const submitBtn = document.getElementById('submitBtn');

            function checkFormValidity() {
                const isNameValid = fullName.value.trim().length > 0;
                const isMobileValid = mobileNumber.value.replace(/\s/g, '').length === 10 && /^\d+$/.test(mobileNumber.value.replace(/\s/g, ''));

                if (isNameValid && isMobileValid) {
                    submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                    submitBtn.classList.add('hover:opacity-90', 'shadow-[0_4px_6px_-1px_rgba(15,23,42,0.05),0_2px_4px_-2px_rgba(15,23,42,0.05)]');
                    submitBtn.removeAttribute('disabled');
                } else {
                    submitBtn.classList.add('opacity-50', 'cursor-not-allowed');
                    submitBtn.classList.remove('hover:opacity-90', 'shadow-[0_4px_6px_-1px_rgba(15,23,42,0.05),0_2px_4px_-2px_rgba(15,23,42,0.05)]');
                    submitBtn.setAttribute('disabled', 'true');
                }
            }

            // Simple mobile number formatting
            mobileNumber.addEventListener('input', function (e) {
                let x = e.target.value.replace(/\D/g, '').match(/(\d{0,5})(\d{0,5})/);
                e.target.value = !x[2] ? x[1] : x[1] + ' ' + x[2];
                checkFormValidity();
            });

            fullName.addEventListener('input', checkFormValidity);

            form.addEventListener('submit', (e) => {
                e.preventDefault();
                if (!submitBtn.disabled) {
                    // Handle submission logic here
                    submitBtn.innerHTML = '<span class="material-symbols-outlined animate-spin" style="font-size: 20px;">progress_activity</span>';
                    setTimeout(() => {
                        submitBtn.innerHTML = 'Continue';
                    }, 1500);
                }
            });
        });
    </script>
