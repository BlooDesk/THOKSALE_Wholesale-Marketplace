<body class="min-h-screen flex flex-col items-center justify-center font-body-md text-brand-slate bg-brand-bg md:bg-brand-bg px-margin-mobile py-xl">
<!-- Top Nav suppressed per instructions (Linear/Transactional) -->
<main class="w-full max-w-[400px] flex flex-col gap-lg bg-brand-surface p-6 md:p-8 rounded-xl border border-slate-200/50 px-4">
<!-- Header -->
<header class="flex flex-col items-center gap-xs mb-sm">
<img alt="THOKSALE Logo" class="h-10 w-auto object-contain mb-4" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBAYgVzU39G5OLiCMsKSqM5HjaghQCSfa8Einx4MRTfeaCMuL2wj4fhOYatoc7DUObA1bMsemOgbOjJLBmMqGjsiYNRiae5d2y_FQG0mnNeBYOvvjW84cihD6HVXhxUZ5MN9OzoZQ4KvTWE_RDuay31d0UhiUNWtyzSPo1pGuS2vEtL1Oy9vkXpMarYZTbipdeQHcpoPeMPcJm61jF2SHXxlcE9fRA0zzbNcQBwSWVSwQDQBsukYfR1sctaYiDSG0v0vTM">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-brand-slate text-center">Welcome back</h1>
<p class="font-body-md text-body-md text-brand-slate-light text-center">Log in to continue to THOKSALE.</p>
</header>
<!-- Form -->
<form class="flex flex-col gap-md" onsubmit="event.preventDefault(); const btn = document.getElementById('continue-btn'); btn.disabled = true; btn.innerHTML = '&lt;span class=&quot;animate-spin mr-2&quot;&gt;&amp;#9696;&lt;/span&gt; Initiating OTP...'; setTimeout(() =&gt; { alert('OTP Sent to ' + document.getElementById('mobile').value); }, 1000);">
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-brand-slate uppercase tracking-wider" for="mobile">Mobile Number</label>
<div class="flex items-center bg-white border border-slate-200 rounded-DEFAULT h-12 input-glow transition-all duration-200 overflow-hidden">
<div class="flex items-center px-3 bg-slate-50 border-r border-slate-200 h-full font-data-mono text-data-mono text-brand-slate-light select-none">
                        +91
                    </div>
<input autocomplete="tel" class="flex-1 h-full px-3 bg-transparent border-none focus:ring-0 font-data-mono text-data-mono text-brand-slate placeholder:text-slate-400" id="mobile" name="mobile" pattern="[0-9]{10}" placeholder="98765 43210" required="" type="tel">
</div>
</div>
<button id="continue-btn" class="w-full h-12 bg-brand-gold opacity-50 grayscale cursor-not-allowed text-white font-label-md text-label-md rounded-DEFAULT transition-all duration-200 flex items-center justify-center uppercase tracking-wider mt-xs" type="submit" disabled="">Continue</button><script>const input = document.getElementById('mobile'); const btn = document.getElementById('continue-btn'); input.addEventListener('input', (e) => { const val = e.target.value.replace(/\D/g, ''); if (val.length === 10) { btn.disabled = false; btn.classList.remove('opacity-50', 'grayscale', 'cursor-not-allowed'); } else { btn.disabled = true; btn.classList.add('opacity-50', 'grayscale', 'cursor-not-allowed'); } });</script>
</form>
<!-- Secondary Actions -->
<div class="flex flex-col items-center gap-sm mt-xs">
<a class="font-body-sm text-body-sm text-brand-slate-light hover:text-brand-slate transition-colors duration-200" href="/recovery">
                Having trouble logging in?
            </a>
<a class="font-body-sm text-body-sm text-brand-slate-light hover:text-brand-slate transition-colors duration-200" href="/register">
                New to THOKSALE? <span class="text-brand-slate font-semibold underline underline-offset-4 decoration-slate-300">Create an account</span>
</a>
</div>
<!-- Footer Consent -->
<div class="mt-md text-center pt-sm border-t border-slate-100">
<p class="font-label-md text-label-md text-brand-slate-light leading-relaxed">
                By continuing, you agree to THOKSALE's <br class="hidden sm:block">
<a class="text-brand-slate underline hover:text-brand-gold transition-colors" href="/terms">Terms of Use</a> and 
                <a class="text-brand-slate underline hover:text-brand-gold transition-colors" href="/privacy">Privacy Policy</a>.
            </p>
</div>
</main>
<!-- Bottom Nav suppressed per instructions (Linear/Transactional) -->
