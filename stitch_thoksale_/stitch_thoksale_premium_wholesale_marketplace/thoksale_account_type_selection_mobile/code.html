<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>

<img alt="THOKSALE Logo" class="h-6 w-auto object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAf9DifU_6ydL8haA1M6g6nSzYj9I5ENgOXO3IVagzmSoM6uZPaobj7qTOO-F-iPxL-YOrx94dOdl1_Rg_0mz-tPaCfuP2qFDYaiyxlWGl8pm8SHo16YWNxE3F_WtwguJt3LT85e4dtmgHil_6yWCZKf5zRiyMXBQ1sjKgKFlBrDOybvQpUfim4sY_8l5X92v2Q3RiaW281RTmUp7hXEbuCTEjoHrRhOPMU2SxCqF_grQhLuPqiwo4azPa3yLSV8rmsG_8">

<div class="mb-8">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-brand-slate mb-2">How do you want to use THOKSALE?</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Choose an account to get started. You can add another account later.</p>
</div>
<!-- Selection Cards -->
<div class="flex flex-col gap-4">
<!-- Buyer Card (Selected) -->
<button aria-pressed="true" class="relative w-full text-left bg-white rounded-xl p-5 transition-all outline-none ring-2 ring-brand-gold border-transparent shadow-[0_4px_6px_-1px_rgba(15,23,42,0.05),0_2px_4px_-2px_rgba(15,23,42,0.05)] transform -translate-y-[2px]">

<div class="absolute top-5 right-5 h-6 w-6 rounded-full bg-brand-gold flex items-center justify-center text-white">
<span class="material-symbols-outlined text-[16px] font-bold" data-icon="check">check</span>
</div>
<div class="flex items-start gap-4 mb-4">
<div class="h-12 w-12 rounded-full bg-surface-container-low flex items-center justify-center text-brand-slate shrink-0">
<span class="material-symbols-outlined text-[24px]" data-icon="shopping_bag">shopping_bag</span>
</div>
<div class="pr-8">

<p class="font-body-sm text-body-sm text-on-surface-variant leading-relaxed">Source products and purchase from wholesale suppliers.</p>
</div>
</div>

<li class="flex items-start gap-2 font-body-sm text-body-sm text-brand-slate/80">
<span class="material-symbols-outlined text-[16px] text-brand-slate/40 mt-[2px]" data-icon="radio_button_unchecked">radio_button_unchecked</span>

                    </li>
<li class="flex items-start gap-2 font-body-sm text-body-sm text-brand-slate/80">
<span class="material-symbols-outlined text-[16px] text-brand-slate/40 mt-[2px]" data-icon="radio_button_unchecked">radio_button_unchecked</span>

                    </li>
<li class="flex items-start gap-2 font-body-sm text-body-sm text-brand-slate/80">
<span class="material-symbols-outlined text-[16px] text-brand-slate/40 mt-[2px]" data-icon="radio_button_unchecked">radio_button_unchecked</span>

                    </li>
</ul>
</button>

<div class="h-12 w-12 rounded-full bg-surface-container-low flex items-center justify-center text-brand-slate shrink-0">

<span class="material-symbols-outlined text-[16px] text-brand-slate/40 mt-[2px]" data-icon="radio_button_unchecked">radio_button_unchecked</span>
