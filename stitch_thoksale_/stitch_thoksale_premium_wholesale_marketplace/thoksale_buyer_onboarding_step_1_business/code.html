<body class="min-h-screen flex flex-col font-body-md">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-surface-dim border-b border-outline-variant/15 flex items-center justify-between px-margin-mobile h-16 w-full fixed top-0 z-50">
<button aria-label="Go back" class="p-2 -ml-2 text-primary hover:opacity-80 transition-opacity active:scale-95 transition-transform">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<div class="flex-1 flex justify-center">
<img alt="THOKSALE Logo" class="h-6 w-auto object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC_axIz5nu7ZyBTQ5j60qs9Ynas7F6D6XYy8wjqbBS-0YMWEXduC8F4HASS6HcaArS08_6Ii-N65qD9qG8LOBRTs9LONIZslxrDHBPzhpxElltqhqn1Uc3pe_uQOLXhuajrZpxA8THBBpZ3tfmYbOEPG-5HAUjDUs0Hh6QSL9tdebARm9f8w4oOjbYnsqLPv9Nblq5RbyD85QzUCWXqMgNHJVQFlKEApsGfPWZYF4z3NUD4L-7vl9O19VhF5VMbR0zMJrc">
</div>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content -->
<main class="flex-grow pt-24 px-margin-mobile pb-32 max-w-lg mx-auto w-full">
<!-- Progress Indicator -->
<div class="mb-8">
<div class="flex justify-between items-center mb-2">
<span class="font-label-md text-gold uppercase tracking-wider text-[10px]">Step 1 of 3</span>
</div>
<div class="flex space-x-2">
<div class="h-1 flex-1 bg-gold rounded-full"></div>
<div class="h-1 flex-1 bg-outline/30 rounded-full"></div>
<div class="h-1 flex-1 bg-outline/30 rounded-full"></div>
</div>
<div class="flex justify-between mt-2 font-label-md text-on-surface-variant text-[10px]">
<span class="text-on-surface">Business</span>
<span class="">Location</span>
<span class="">Review</span>
</div>
</div>
<!-- Heading -->
<div class="mb-10">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-3">Tell us about your business</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Set up your Buyer account to start sourcing wholesale products.</p>
</div>
<!-- Form -->
<form class="space-y-6 flex flex-col">
<!-- Business Name -->
<div class="space-y-2">
<label class="block font-label-md text-label-md text-on-surface" for="businessName">Business / Store Name</label>
<input class="form-input w-full bg-surface border border-outline text-on-surface rounded px-4 py-3 font-body-md transition-all duration-200 outline-none" id="businessName" name="businessName" placeholder="Enter your business or store name" required="" type="text">
</div>
<!-- Business Type -->
<div class="space-y-2">
<label class="block font-label-md text-label-md text-on-surface" for="businessType">Business Type</label>
<div class="relative">
<select class="form-input w-full bg-surface border border-outline text-on-surface rounded px-4 py-3 font-body-md appearance-none transition-all duration-200 outline-none" id="businessType" name="businessType" required=""><option disabled="" selected="" value="">Select business type</option><option value="retailer">Retailer</option><option value="wholesaler">Wholesaler</option><option value="sub-dealer">Sub-Dealer</option><option value="dealer">Dealer</option><option value="distributor">Distributor</option><option value="cnf-agent">C&amp;F Agent</option><option value="other">Other</option></select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-on-surface-variant">
<span class="material-symbols-outlined">expand_more</span>
</div>
</div>
</div>
<!-- GSTIN -->
<div class="space-y-2 pt-4">
<label class="block font-label-md text-label-md text-on-surface flex justify-between items-end" for="gstin">
<span class="">GSTIN (Optional)</span>

</label>
<input class="form-input w-full bg-surface border border-outline text-on-surface rounded px-4 py-3 font-body-md uppercase transition-all duration-200 outline-none" id="gstin" name="gstin" placeholder="Enter 15-digit GSTIN" type="text"><div id="gstin-status" class="hidden mt-2 flex items-center space-x-2 font-label-md text-[11px]"></div>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-2 text-sm">Optional. If left empty, your account will proceed as 'GSTIN not provided'. Adding it later enables full tax workflows.</p>
</div>
</form>
</main>
<!-- Fixed Bottom CTA -->
<div class="fixed bottom-0 left-0 w-full bg-background border-t border-outline/10 p-margin-mobile pb-[max(16px,env(safe-area-inset-bottom))] z-40">
<div class="max-w-lg mx-auto">
<button class="w-full bg-primary text-on-primary font-headline-sm text-headline-sm py-4 rounded disabled:opacity-50 disabled:cursor-not-allowed transition-all duration-200 flex justify-center items-center" disabled="" id="continueBtn">
                Continue
            </button>
</div>
</div>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const nameInput = document.getElementById('businessName');
            const typeSelect = document.getElementById('businessType');
            const continueBtn = document.getElementById('continueBtn');

            function checkFormValidity() {
                if (nameInput.value.trim() !== '' && typeSelect.value !== '') {
                    continueBtn.disabled = false;
                } else {
                    continueBtn.disabled = true;
                }
            }

            nameInput.addEventListener('input', checkFormValidity);
            typeSelect.addEventListener('change', checkFormValidity);
        });
    </script>


</body></html>
