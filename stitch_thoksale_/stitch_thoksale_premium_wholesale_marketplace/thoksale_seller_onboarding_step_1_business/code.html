<!DOCTYPE html>

<html class="light" lang="en"><head>

<style>
        body { font-family: 'Manrope', sans-serif; background-color: #F9F8F4; }
        .input-outline { border: 1px solid #E2E8F0; transition: all 0.2s ease-in-out; }
        .input-outline:focus { border-color: #B5924D; outline: none; box-shadow: 0 0 0 2px rgba(181, 146, 77, 0.2); }
        .select-wrapper { position: relative; }
        .select-wrapper::after {
            content: 'expand_more';
            font-family: 'Material Symbols Outlined';
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            color: #64748B;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col text-on-surface antialiased">
<!-- Header -->
<header class="sticky top-0 bg-white/90 backdrop-blur-md border-b border-brand-slate/10 z-50 px-margin-mobile py-4 flex items-center justify-between">
<button class="p-2 -ml-2 text-brand-slate hover:bg-surface-container-low rounded-full transition-colors flex items-center justify-center" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<div class="h-6 w-auto flex-1 flex justify-center">
<img alt="THOKSALE Logo" class="h-full w-auto object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuA6ieGucqjk-YdVPOvI3p0vgP5_d8SXM01OLZgmRHLvkNvRytiTjKY7B4XvcEDFL1bhxex4uu6VXc_WwdP8Ulkvq1CD-YvW-9zkYTcRHjDq0PwfM2C-Gi7cBhH1pbhMAMtWTP3Knq6Y7GfXQG2eghnzaJKxc80Dy6ABZOgJ1J2UUN7c6UAn03hDRe5XWJ2sPtMxUpYaXadg2hGFCJTd7BFSF_dzHiarsNl5nkb-v3iD8bvskk3oNfIuUaS5pGARD5cll3o"/>
</div>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content -->
<main class="flex-1 px-margin-mobile py-lg pb-32 flex flex-col max-w-md mx-auto w-full">
<!-- Progress Indicator -->
<div class="mb-8">
<div class="flex justify-between items-center mb-2">
<span class="font-label-md text-label-md text-brand-gold uppercase tracking-widest">Step 1 of 4</span>
<span class="font-label-md text-label-md text-brand-slate/60">Business Details</span>
</div>
<div class="flex gap-2">
<div class="h-1 flex-1 bg-brand-gold rounded-full"></div>
<div class="h-1 flex-1 bg-brand-slate/10 rounded-full"></div>
<div class="h-1 flex-1 bg-brand-slate/10 rounded-full"></div>
<div class="h-1 flex-1 bg-brand-slate/10 rounded-full"></div>
</div>
</div>
<!-- Heading -->
<div class="mb-8">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-brand-slate mb-3">Tell us about your business</h1>
<p class="font-body-md text-body-md text-brand-slate/70">Set up your Seller account to start selling on THOKSALE.</p>
</div>
<!-- Form -->
<form class="space-y-6 flex-1 flex flex-col">
<!-- Legal Business Name -->
<div class="bg-white p-5 rounded-xl border border-brand-slate/10 shadow-[0_4px_6px_-1px_rgba(15,23,42,0.02)]">
<label class="block font-label-md text-label-md text-brand-slate mb-2" for="legalName">Legal Business Name</label>
<input class="w-full bg-white rounded-lg px-4 py-3 font-body-md text-body-md text-brand-slate input-outline" id="legalName" placeholder="Enter your registered business name" type="text"/>
</div>
<!-- Display / Store Name -->
<div class="bg-white p-5 rounded-xl border border-brand-slate/10 shadow-[0_4px_6px_-1px_rgba(15,23,42,0.02)]">
<label class="block font-label-md text-label-md text-brand-slate mb-2" for="displayName">Display / Store Name</label>
<input class="w-full bg-white rounded-lg px-4 py-3 font-body-md text-body-md text-brand-slate input-outline mb-2" id="displayName" placeholder="Enter the name buyers will see" type="text"/>
<p class="font-body-sm text-body-sm text-brand-slate/60 flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">info</span>
                    You can update your display name later.
                </p>
</div>
<!-- Business Type -->
<div class="bg-white p-5 rounded-xl border border-brand-slate/10 shadow-[0_4px_6px_-1px_rgba(15,23,42,0.02)]">
<label class="block font-label-md text-label-md text-brand-slate mb-2" for="businessType">Business Type</label>
<div class="select-wrapper">
<select class="w-full appearance-none bg-white rounded-lg px-4 py-3 pr-10 font-body-md text-body-md text-brand-slate input-outline" id="businessType">
<option disabled="" selected="" value="">Select your primary business type</option>
<option value="manufacturer">Manufacturer</option>
<option value="factory">Factory</option>
<option value="brand_owner">Brand Owner</option>
<option value="wholesaler">Wholesaler</option>
<option value="distributor">Distributor</option>
<option value="importer">Importer</option>
<option value="trader">Trader</option>
<option value="other">Other</option>
</select>
</div>
</div>
<!-- GSTIN -->
<div class="bg-white p-5 rounded-xl border border-brand-slate/10 shadow-[0_4px_6px_-1px_rgba(15,23,42,0.02)]">
<div class="flex justify-between items-end mb-2">
<label class="block font-label-md text-label-md text-brand-slate" for="gstin">GSTIN</label>
<button class="font-label-md text-label-md text-brand-gold underline decoration-brand-gold/30 hover:decoration-brand-gold transition-colors" type="button">
                        GSTIN not applicable to my business
                    </button>
</div>
<input class="w-full bg-white rounded-lg px-4 py-3 font-data-mono text-data-mono text-brand-slate uppercase input-outline mb-2 tracking-wider" id="gstin" maxlength="15" placeholder="Enter 15-character GSTIN" type="text"/>
<p class="font-body-sm text-body-sm text-brand-slate/60">Used for applicable business verification and tax workflows.</p>
</div>
</form>
</main>
<!-- Bottom Action Bar (Fixed) -->
<div class="fixed bottom-0 left-0 right-0 bg-white border-t border-brand-slate/10 p-margin-mobile shadow-[0_-4px_6px_-1px_rgba(15,23,42,0.02)] z-50">
<div class="max-w-md mx-auto w-full">
<button class="w-full bg-brand-slate text-white font-label-md text-label-md uppercase tracking-wider py-4 rounded-lg hover:bg-brand-slate/90 transition-colors shadow-sm disabled:opacity-50 disabled:cursor-not-allowed" type="button">
                Continue
            </button>
</div>
</div>
</body></html>
